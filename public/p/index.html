<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABYRITH</title>
<meta name="theme-color" content="#06060a">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<header class="nav is-stuck">
  <a class="nav__mark" href="/" aria-label="Abyrith — home">
    <span class="nav__glyph" aria-hidden="true"></span><span class="nav__word">ABYRITH</span>
  </a>
  <div class="nav__right">
    <a class="btn btn--ghost nav__cta" href="/">Back to the site</a>
  </div>
</header>

<main class="legal">
  <div class="wrap wrap--narrow">
    <h1 class="display" id="pgTitle">…</h1>
    <div id="pgBody"></div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <p class="foot__title">ABYRITH <span>· The Fracturing of Light</span></p>
    <p class="foot__by">
      © <span id="yr">2026</span> Dejan Davcevski. All rights reserved.
      <a class="foot__link" href="/privacy">Privacy &amp; data</a>
    </p>
  </div>
</footer>

<script>
(async function page(){
  var SB = {
    url: "https://raaffebeteodotpwyfgi.supabase.co",
    key: "sb_publishable_PaP7U71NhtqY980fd4RnWg_gvpf1gtA"
  };
  document.getElementById("yr").textContent = new Date().getFullYear();

  var slug = new URLSearchParams(location.search).get("s") || "";
  var title = document.getElementById("pgTitle");
  var body  = document.getElementById("pgBody");

  if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
    title.textContent = "Page not found";
    body.innerHTML = '<p class="lede">That address does not resolve. <a href="/">Back to the site</a>.</p>';
    return;
  }
  try {
    var res = await fetch(
      SB.url + "/rest/v1/abyrith_pages?select=title,body&published=is.true&slug=eq." + encodeURIComponent(slug),
      { headers: { apikey: SB.key, Authorization: "Bearer " + SB.key } }
    );
    var rows = res.ok ? await res.json() : [];
    if (!rows.length) {
      title.textContent = "Page not found";
      body.innerHTML = '<p class="lede">Nothing is filed under that name. <a href="/">Back to the site</a>.</p>';
      return;
    }
    var row = rows[0];
    document.title = row.title + " — ABYRITH";
    title.textContent = row.title;

    // Plain text is turned into paragraphs; anything with tags is used as-is.
    var raw = row.body || "";
    if (/<[a-z][\s\S]*>/i.test(raw)) {
      body.innerHTML = raw;
    } else {
      body.innerHTML = raw.split(/\n{2,}/).map(function (p) {
        return "<p>" + p.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>") + "</p>";
      }).join("");
    }
  } catch (e) {
    title.textContent = "Unavailable";
    body.innerHTML = '<p class="lede">The Registry did not answer. Try again shortly.</p>';
  }
})();
</script>
</body>
</html>
